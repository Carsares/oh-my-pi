name: Desktop CI

on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
    paths:
      - "apps/desktop/**"
      - "Cargo.toml"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "Cargo.toml"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          WEBKIT_DEV_PKG="libwebkit2gtk-4.1-dev"
          if ! apt-cache show "$WEBKIT_DEV_PKG" >/dev/null 2>&1; then
            WEBKIT_DEV_PKG="libwebkit2gtk-4.0-dev"
          fi
          sudo apt-get install -y \
            "$WEBKIT_DEV_PKG" \
            libappindicator3-dev \
            librsvg2-dev \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good

      - name: Install desktop dependencies
        run: bun install --frozen-lockfile

      - name: Validate desktop release tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          expected="${GITHUB_REF_NAME#desktop-v}"
          package_version="$(jq -r '.version' package.json)"
          tauri_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          cargo_version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n1)"
          test "$expected" = "$package_version"
          test "$expected" = "$tauri_version"
          test "$expected" = "$cargo_version"

      - name: Check desktop sources
        run: bun run check

      - name: Test desktop frontend
        run: bun run test

      - name: Check desktop Rust crate
        run: bun run check:rust

# Desktop publishing is added after the bundled runtime is switched from Pi to
# the customized OMP binary. Until then, desktop-v* tags validate but do not
# publish an installer that contains the wrong runtime.
